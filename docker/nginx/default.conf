server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    # re-resolve the php upstream after the container is recreated
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream starter-php:9000;
    client_max_body_size 20m;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\")" always;
    # The Content-Security-Policy (and HSTS on HTTPS in production) come from the app's SecurityHeaders middleware, which
    # derives the Plausible origin from PLAUSIBLE_SRC. nginx only sets the headers below for static files.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # only index.php ever reaches PHP-FPM
    location ~ \.php$ { return 404; }

    location = /index.php {
        fastcgi_hide_header X-Powered-By;
        # nginx sets these four itself (see above); do not send PHP's copy as well
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Permissions-Policy;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
