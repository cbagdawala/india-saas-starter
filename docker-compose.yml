# India SaaS Starter Kit: standalone local stack (php-fpm, nginx, MySQL 8, Redis, queue worker, scheduler, Mailpit).
# Quickstart: see README.md. App: http://127.0.0.1:8200  Mailpit UI: http://127.0.0.1:8225
name: india-saas-starter

x-php: &php
  image: india-saas-starter-php:local
  build:
    context: ./docker/php
    args:
      UID: ${HOST_UID:-501}
      GID: ${HOST_GID:-20}
  env_file: .env
  working_dir: /var/www/html
  restart: unless-stopped
  volumes:
    - ./:/var/www/html

services:
  starter-php:
    <<: *php
    container_name: starter-php
    depends_on:
      starter-mysql: {condition: service_healthy}
      starter-redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 15s
      timeout: 5s
      retries: 5

  starter-nginx:
    image: nginx:1.27-alpine
    container_name: starter-nginx
    restart: unless-stopped
    ports: ["127.0.0.1:8200:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      starter-php: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  starter-mysql:
    image: mysql:8.4
    container_name: starter-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-india_saas_starter}
      MYSQL_USER: ${DB_USERNAME:-starter}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
    ports: ["127.0.0.1:3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  starter-redis:
    image: redis:7-alpine
    container_name: starter-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  starter-queue:
    <<: *php
    container_name: starter-queue
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-time=3600
    stop_grace_period: 30s
    depends_on:
      starter-php: {condition: service_healthy}

  starter-scheduler:
    <<: *php
    container_name: starter-scheduler
    command: php artisan schedule:work
    depends_on:
      starter-php: {condition: service_healthy}

  starter-mailpit:
    image: axllent/mailpit:v1.21
    container_name: starter-mailpit
    restart: unless-stopped
    ports: ["127.0.0.1:8225:8025"]

  # One-off asset build: docker compose --profile build run --rm starter-build
  # (container-local node_modules volume: the host's holds macOS-native binaries)
  starter-build:
    <<: *php
    container_name: starter-build
    profiles: [build]
    env_file: []   # no secrets to npm scripts
    restart: "no"
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    environment:
      HOME: /home/app
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules

volumes:
  mysql-data:
  redis-data:
  node_modules:
